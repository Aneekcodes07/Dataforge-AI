version: '3.8'

services:
  # 1. API Server (FastAPI)
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://dataforge:secure_pass@db:5432/dataforge_ai
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=prod-secret-key-change-in-production
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    depends_on:
      - db
      - redis
    restart: always

  # 2. Celery Worker
  worker:
    build: .
    command: celery -A src.celery_app worker --loglevel=info
    environment:
      - DATABASE_URL=postgresql://dataforge:secure_pass@db:5432/dataforge_ai
      - REDIS_URL=redis://redis:6379/0
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    depends_on:
      - redis
      - db
    restart: always

  # 3. PostgreSQL Database
  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_DB=dataforge_ai
      - POSTGRES_USER=dataforge
      - POSTGRES_PASSWORD=secure_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

  # 4. Redis Cache & Message Broker
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    restart: always

volumes:
  postgres_data:
