name: Docker CI

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'backend/Dockerfile'
      - 'backend/src/**'
      - 'backend/requirements.txt'
      - 'frontend/Dockerfile'
      - 'frontend/src/**'
      - 'frontend/package.json'
      - 'docker-compose.yml'
      - 'nginx.conf'
      - '.github/workflows/docker-ci.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'backend/Dockerfile'
      - 'backend/src/**'
      - 'backend/requirements.txt'
      - 'frontend/Dockerfile'
      - 'frontend/src/**'
      - 'frontend/package.json'
      - 'docker-compose.yml'
      - 'nginx.conf'
      - '.github/workflows/docker-ci.yml'

jobs:
  verify-compose:
    name: Verify Compose Configuration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Validate Compose Config
        run: |
          docker compose config

  build-and-scan:
    name: Build & Scan Images
    runs-on: ubuntu-latest
    needs: verify-compose
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build Backend Image
        run: |
          docker build -t dataforge-backend:latest ./backend

      - name: Build Frontend Image
        run: |
          docker build -t dataforge-frontend:latest --build-arg VITE_SENTRY_DSN="" ./frontend

      - name: Run Trivy Scanner (Backend Image)
        uses: aquasecurity/trivy-action@0.20.0
        with:
          image-ref: 'dataforge-backend:latest'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'

      - name: Run Trivy Scanner (Frontend Image)
        uses: aquasecurity/trivy-action@0.20.0
        with:
          image-ref: 'dataforge-frontend:latest'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'
