name: Backend CI

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'

defaults:
  run:
    working-directory: backend

jobs:
  lint-and-format:
    name: Lint and Format (Ruff)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/upload-artifact@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Linting Tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Run Ruff Linter
        run: ruff check src

      - name: Verify Code Formatting
        run: ruff format --check src

  static-typecheck:
    name: Static Type Check (Mypy)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/upload-artifact@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install mypy

      - name: Run Mypy Type Checker
        run: mypy src

  security-scan:
    name: Security Scan (Bandit & Safety)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/upload-artifact@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Security Tools
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install bandit safety

      - name: Run Bandit (Code Scanning)
        run: bandit -r src -ll

      - name: Run Safety (Dependency Audit)
        run: safety check

  unit-tests:
    name: Unit Tests & Code Coverage
    runs-on: ubuntu-latest
    needs: [lint-and-format, static-typecheck, security-scan]
    steps:
      - name: Checkout Repository
        uses: actions/upload-artifact@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run Pytest with Coverage
        env:
          DATABASE_URL: sqlite:///test.db
          REDIS_URL: redis://localhost:6379/0
          PYTHONPATH: .
        run: |
          python -m pytest --cov=src --cov-config=.coveragerc --cov-report=xml --cov-report=term-missing tests/

      - name: Upload Test and Coverage Reports
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-report
          path: backend/coverage.xml
          retention-days: 7
