version: '3.8'

services:
  # 1. PostgreSQL Production Database
  postgres:
    image: postgres:15-alpine
    container_name: dataforge-postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dataforge_ai}
      POSTGRES_USER: ${POSTGRES_USER:-dataforge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secure_pass}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - dataforge-network
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          memory: 256M
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-dataforge} -d $${POSTGRES_DB:-dataforge_ai}" ]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Redis Message Broker & Key-Value Cache
  redis:
    image: redis:7-alpine
    container_name: dataforge-redis
    restart: always
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis-data:/data
    networks:
      - dataforge-network
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          memory: 64M
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 5

  # 3. FastAPI REST/WebSocket Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dataforge-backend
    restart: always
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://dataforge:secure_pass@postgres:5432/dataforge_ai}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      # SECRET_KEY MUST be overridden with a strong, unique value (>=32 chars),
      # e.g. `openssl rand -hex 32`. With DEBUG=false the API refuses to start
      # while this placeholder is in use (see src/main.py startup guard).
      SECRET_KEY: ${SECRET_KEY:-prod-secret-key-change-in-production}
      DEBUG: ${DEBUG:-false}
      # Only the API applies migrations on startup; workers/beat must not race.
      RUN_MIGRATIONS: "true"
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      SENTRY_DSN: ${SENTRY_DSN}
      SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0.1}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - dataforge-network
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          memory: 256M
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/api/health" ]
      interval: 10s
      timeout: 5s
      retries: 3

  # 4. Celery Worker (Pipeline & Agent Execution)
  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dataforge-celery-worker
    command: celery -A src.celery_app worker --loglevel=info
    restart: always
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://dataforge:secure_pass@postgres:5432/dataforge_ai}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      SENTRY_DSN: ${SENTRY_DSN}
      SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0.1}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - dataforge-network
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 1.5G
        reservations:
          memory: 512M
    healthcheck:
      test: [ "CMD-SHELL", "celery -A src.celery_app inspect ping" ]
      interval: 30s
      timeout: 10s
      retries: 3

  # 5. Celery Beat Scheduler (Periodic Maintenance Checks)
  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dataforge-celery-beat
    command: celery -A src.celery_app beat --loglevel=info --pidfile=
    restart: always
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://dataforge:secure_pass@postgres:5432/dataforge_ai}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      SENTRY_DSN: ${SENTRY_DSN}
      SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0.1}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - dataforge-network
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          memory: 64M

  # 6. React/Vite Frontend Webserver
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_SENTRY_DSN=${VITE_SENTRY_DSN}
    container_name: dataforge-frontend
    restart: always
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - dataforge-network
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          memory: 64M
    healthcheck:
      test: [ "CMD-SHELL", "wget --spider -q http://127.0.0.1/ || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 3
  # 7. Global Nginx Reverse Proxy (Unified Router Entrypoint)
  nginx:
    image: nginx:1.25-alpine
    container_name: dataforge-nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    networks:
      - dataforge-network
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          memory: 64M

  # 8. Prometheus Metric Scraper
  prometheus:
    image: prom/prometheus:v2.45.0
    container_name: dataforge-prometheus
    restart: always
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alert.rules.yml:/etc/prometheus/alert.rules.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - dataforge-network
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          memory: 128M

  # 9. Grafana Visualization Dashboard
  grafana:
    image: grafana/grafana:10.0.3
    container_name: dataforge-grafana
    restart: always
    ports:
      - "3000:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    depends_on:
      - prometheus
    networks:
      - dataforge-network
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          memory: 128M

  # 10. System Host Metrics Exporter
  node-exporter:
    image: prom/node-exporter:v1.6.1
    container_name: dataforge-node-exporter
    restart: always
    ports:
      - "9100:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    networks:
      - dataforge-network
    deploy:
      resources:
        limits:
          cpus: '0.2'
          memory: 128M
        reservations:
          memory: 32M

volumes:
  postgres-data:
  redis-data:
  prometheus-data:
  grafana-data:

networks:
  dataforge-network:
    name: dataforge-network
    driver: bridge
